[project]
name = "quant-backtest-api"
version = "0.1.0"
description = "Read-only FastAPI backend for persisted backtest results"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

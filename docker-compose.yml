services:
  postgres:
    image: postgres:16-alpine
    profiles: ["db", "backend", "frontend", "backtest", "ingestion", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quant_bitcoin}
      POSTGRES_USER: ${POSTGRES_USER:-quant_bitcoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_bitcoin_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["backend", "frontend", "full"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quant_bitcoin}:${POSTGRES_PASSWORD:-quant_bitcoin_dev}@postgres:5432/${POSTGRES_DB:-quant_bitcoin}
      BACKTEST_API_ENV: ${BACKTEST_API_ENV:-dev}
      BACKTEST_API_CORS_ORIGINS: ${BACKTEST_API_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    profiles: ["frontend", "full"]
    environment:
      NEXT_PUBLIC_BACKTEST_API_BASE_URL: ${NEXT_PUBLIC_BACKTEST_API_BASE_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  backtest:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["backtest", "full"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quant_bitcoin}:${POSTGRES_PASSWORD:-quant_bitcoin_dev}@postgres:5432/${POSTGRES_DB:-quant_bitcoin}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - quant_bitcoin.backtesting.pattern_postgres_runner_cli
      - --help

  websocket-ingestor:
    build: .
    profiles: ["ingestion"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quant_bitcoin}:${POSTGRES_PASSWORD:-quant_bitcoin_dev}@postgres:5432/${POSTGRES_DB:-quant_bitcoin}
      SYMBOL: ${SYMBOL:-BTCUSDT}
      INTERVAL: ${INTERVAL:-1m}
      INGEST_MAX_MESSAGES: ${INGEST_MAX_MESSAGES:-unbounded}
      RECONNECT_DELAY_SECONDS: ${RECONNECT_DELAY_SECONDS:-1.0}
      MAX_RECONNECTS: ${MAX_RECONNECTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - quant-bitcoin-websocket-ingestion
      - ingest

volumes:
  postgres_data:
